<ion-header class="ion-no-border">
  <ion-toolbar>
    <div class="main-header-content">
      <div class="header-user-info">
        <div class="avatar-header-ring" [class.google-ring]="isGoogleUser && user?.photoURL">
          <div class="avatar-header-inner">
            <img *ngIf="isGoogleUser && user?.photoURL" [src]="user!.photoURL" alt="Avatar" />
            <ion-icon *ngIf="!isGoogleUser || !user?.photoURL" name="person-circle-outline" class="avatar-header-placeholder"></ion-icon>
          </div>
        </div>
        <div class="header-titles">
          <span class="header-logo">Salas de chat</span>
          <span class="header-subtitle">{{ user?.email || 'alumno@correo.com' }}</span>
        </div>
      </div>
      <div class="header-actions">
        <ion-icon name="log-out-outline" class="exit-icon" style="transform: scaleX(-1);"></ion-icon>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-gray">
  <div class="chats-container">
    
    <div class="search-container">
      <ion-searchbar 
        placeholder="Buscar sala" 
        searchIcon="search-outline"
        class="custom-searchbar">
      </ion-searchbar>
    </div>

    <div class="chips-container">
      <ion-chip class="chip-active">
        <ion-label>Todas</ion-label>
      </ion-chip>
      <ion-chip>
        <ion-label>Académicas</ion-label>
      </ion-chip>
      <ion-chip>
        <ion-label>Social</ion-label>
      </ion-chip>
      <ion-chip>
        <ion-label>Urgente</ion-label>
      </ion-chip>
    </div>

    <div class="empty-state" *ngIf="(groups$ | async)?.length === 0">
      <ion-icon name="chatbubbles-outline"></ion-icon>
      <p>No hay salas de chat disponibles. ¡Crea la primera!</p>
    </div>

    <div class="groups-list" *ngIf="(groups$ | async) as groups">
      <!-- Mapeo de grupos reales de Firebase -->
      <div class="chat-card" *ngFor="let group of groups; let i = index" (click)="openChatRoom(group._id)">
        <div class="card-border" [ngClass]="getCardBorderClass(i)"></div>
        <div class="card-content">
          <div class="icon-wrapper" [ngClass]="getCardIconClass(i)">
            <ion-icon [name]="getCardIconName(i)"></ion-icon>
          </div>
          <div class="text-content">
            <div class="title-row">
              <h3>{{ group.name }}</h3>
              <span class="time">{{ formatTime(group.created_at) }}</span>
            </div>
            <p>{{ group.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="custom-fab">
    <ion-fab-button (click)="openCreateGroup()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
